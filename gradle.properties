# Gradle JVM settings - max heap for the build, no daemon (cleaner for FG)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties
# NOTE: .properties files do NOT support trailing comments - keep comments
# on their own line or they become part of the value.
# Version-specific values (minecraft_version, loader versions, java_version,
# mod_version) live in versions/<node>/gradle.properties - one per Stonecutter
# project: versions/1.20.1 (Forge) and versions/1.21.1 (NeoForge).


## Mod Properties (shared by every version node)

mod_id=poseidonlib
mod_name=Poseidon Lib
mod_license=MIT
mod_group_id=com.poseidon.poseidonlib
mod_authors=Poseidon, hayasanjo0-spec
mod_description=Shared utilities for Poseidon's Minecraft mods: datapack JSON loader base, reload-listener wiring, entity predicates and common building blocks used across Forge/NeoForge projects.
